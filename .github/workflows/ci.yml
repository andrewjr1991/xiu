name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 20.18.1
            platform: win32
          - os: ubuntu-latest
            node: 20.18.1
            platform: linux
          - os: macos-latest
            node: 20.18.1
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run typecheck
      - name: Run tests
        run: npm run test:ci
      - run: npm run build
      - name: Run deterministic evaluation smoke
        run: npm run eval:smoke
      - run: npm pack --dry-run --json
      - run: npm run smoke:package
      - name: Run packaged platform acceptance
        run: npm run smoke:platform
        env:
          XIU_EXPECTED_PLATFORM: ${{ matrix.platform }}
